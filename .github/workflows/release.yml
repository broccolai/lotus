name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: verify version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "lotus-app").version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match lotus-app version $version"
          }
          "LOTUS_VERSION=$version" >> $env:GITHUB_ENV
          $numericVersion = ($version -split "-", 2)[0]
          "LOTUS_VERSION_INFO=$numericVersion.0" >> $env:GITHUB_ENV
      - name: build
        shell: cmd
        run: cargo build --release --locked -p lotus-app -p lotus-shell-bridge -p lotus-explorer-bridge
      - name: package portable build
        shell: pwsh
        run: |
          $archive = "lotus-v$env:LOTUS_VERSION-windows-x86_64.zip"
          $stage = Join-Path $env:RUNNER_TEMP "lotus"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target\release\lotus.exe, target\release\lotus_shell_bridge.dll, target\release\lotus_explorer_bridge.dll, LICENSE, THIRD_PARTY_NOTICES.md, README.md -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii
          "LOTUS_ARCHIVE=$archive" >> $env:GITHUB_ENV
      - name: package installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed with exit code $LASTEXITCODE"
            }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup is unavailable after installation"
          }
          & $iscc installer\lotus.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = "dist\lotus-v$env:LOTUS_VERSION-windows-x86_64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Inno Setup completed without producing $setup"
          }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content "$setup.sha256" -Encoding ascii
          $bundle = Join-Path $env:RUNNER_TEMP "release-bundle"
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item $env:LOTUS_ARCHIVE, "$env:LOTUS_ARCHIVE.sha256", $setup, "$setup.sha256" -Destination $bundle
      - name: upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: ${{ runner.temp }}\release-bundle
          if-no-files-found: error

  publish:
    needs: windows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: download release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-bundle
          path: release-bundle
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          arguments=(
            release create "$GITHUB_REF_NAME"
            release-bundle/*
            --verify-tag
            --title "lotus $GITHUB_REF_NAME"
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"
