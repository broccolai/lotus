name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        shell: powershell
        run: choco install ripgrep --yes --no-progress
      - name: Check architecture boundaries
        shell: powershell
        run: |
          $safeSources = @(
            "crates/lotus-app/src",
            "crates/lotus-core/src",
            "crates/lotus-dock/src",
            "crates/lotus-search/src",
            "crates/lotus-settings/src",
            "crates/lotus-switcher/src",
            "crates/lotus-ui/src"
          )
          rg --pcre2 -n '(?<!lotus_)\bwindows::|\bunsafe\s*(\{|fn\b|impl\b|trait\b|extern\b)' $safeSources
          if ($LASTEXITCODE -eq 0) {
            throw "Raw Windows or unsafe code is only allowed in lotus-windows and isolated shell bridges"
          }
          if ($LASTEXITCODE -gt 1) {
            exit $LASTEXITCODE
          }

          $safeManifests = @(
            "crates/lotus-app/Cargo.toml",
            "crates/lotus-core/Cargo.toml",
            "crates/lotus-dock/Cargo.toml",
            "crates/lotus-search/Cargo.toml",
            "crates/lotus-settings/Cargo.toml",
            "crates/lotus-switcher/Cargo.toml",
            "crates/lotus-ui/Cargo.toml"
          )
          rg -n '^windows\.workspace' $safeManifests
          if ($LASTEXITCODE -eq 0) {
            throw "The windows dependency is only allowed in lotus-windows and isolated shell bridges"
          }
          if ($LASTEXITCODE -gt 1) {
            exit $LASTEXITCODE
          }
      - name: Check Rust
        shell: powershell
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo clippy --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo build -p lotus-app -p lotus-shell-bridge -p lotus-explorer-bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
