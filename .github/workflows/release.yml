name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: verify version
        shell: powershell
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "lotus-app").version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match lotus-app version $version"
          }
          "LOTUS_VERSION=$version" >> $env:GITHUB_ENV
          $numericVersion = ($version -split "-", 2)[0]
          "LOTUS_VERSION_INFO=$numericVersion.0" >> $env:GITHUB_ENV
      - name: build
        shell: cmd
        run: cargo build --release --locked -p lotus-app -p lotus-shell-bridge -p lotus-explorer-bridge
      - name: package portable build
        shell: powershell
        run: |
          $archive = "lotus-v$env:LOTUS_VERSION-windows-x86_64.zip"
          $stage = Join-Path $env:RUNNER_TEMP "lotus"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target\release\lotus.exe, target\release\lotus_shell_bridge.dll, target\release\lotus_explorer_bridge.dll, LICENSE, THIRD_PARTY_NOTICES.md, README.md -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii
          "LOTUS_ARCHIVE=$archive" >> $env:GITHUB_ENV
      - name: package installer
        shell: powershell
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\lotus.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = "dist\lotus-v$env:LOTUS_VERSION-windows-x86_64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Inno Setup completed without producing $setup"
          }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content "$setup.sha256" -Encoding ascii
          "LOTUS_SETUP=$setup" >> $env:GITHUB_ENV
      - name: publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            $env:LOTUS_ARCHIVE,
            "$env:LOTUS_ARCHIVE.sha256",
            $env:LOTUS_SETUP,
            "$env:LOTUS_SETUP.sha256",
            "--verify-tag",
            "--title", "lotus $env:GITHUB_REF_NAME",
            "--generate-notes"
          )
          if ($env:LOTUS_VERSION.Contains("-")) {
            $arguments += "--prerelease"
          }
          & gh @arguments
