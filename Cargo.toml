[workspace]
members = [
    "crates/lotus-core",
    "crates/lotus-dock",
    "crates/lotus-media",
    "crates/lotus-search",
    "crates/lotus-settings",
    "crates/lotus-switcher",
    "crates/lotus-update",
    "crates/lotus-app",
    "crates/lotus-ui",
    "crates/lotus-windows",
]
resolver = "3"

[workspace.package]
version = "0.12.3"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Lotus contributors"]

[workspace.dependencies]
atomic-write-file = "0.3.0"
euclid = "0.22.14"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
lotus-core = { path = "crates/lotus-core" }
lotus-dock = { path = "crates/lotus-dock" }
lotus-media = { path = "crates/lotus-media" }
lotus-search = { path = "crates/lotus-search" }
lotus-settings = { path = "crates/lotus-settings" }
lotus-switcher = { path = "crates/lotus-switcher" }
lotus-ui = { path = "crates/lotus-ui" }
lotus-update = { path = "crates/lotus-update" }
lotus-windows = { path = "crates/lotus-windows" }
fasteval = { version = "0.2.4", default-features = false }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tiny-skia = "0.12.0"
ureq = { version = "3.3", default-features = false, features = ["json", "rustls"] }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
windows-registry = "0.6.1"
windows-result = "0.4.1"
winresource = "0.1.31"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
chunks_exact_to_as_chunks = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
